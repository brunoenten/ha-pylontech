[project]
name = "ha-pylontech"
version = "0.1.0"
description = "Home Assistant integration for Pylontech US-series batteries over the RS232 console"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
